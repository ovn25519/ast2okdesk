name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация релиза
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Go для основного сервиса
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка okdesk
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA:0:7}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit}" \
            -o okdesk ./cmd/okdesk

      - name: Установка Go для сборки Caddy
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Установка xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7

      - name: Сборка caddy-regru
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            "$(go env GOPATH)/bin/xcaddy" build v2.11.2 \
            --with github.com/heinwol/caddy-dns-regru@v0.1.10 \
            --output caddy-regru
          ./caddy-regru version

      - name: Формирование архива и контрольных сумм
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          archive="ast2okdesk_${version}_linux_amd64.tar.gz"
          tar -czf "${archive}" \
            okdesk config.example.toml README.md LICENSE deploy
          sha256sum "${archive}" caddy-regru > sha256sum.txt
          cat sha256sum.txt

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          archive="ast2okdesk_${version}_linux_amd64.tar.gz"
          gh release create "${version}" \
            "${archive}" \
            caddy-regru \
            sha256sum.txt \
            install.sh \
            --title "ast2okdesk ${version}" \
            --generate-notes
