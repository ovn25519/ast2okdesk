name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Тесты и проверки
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверка форматирования (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Следующие файлы не отформатированы gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Вет-анализ (go vet)
        run: go vet ./...

      - name: Тесты (go test -race)
        run: go test -race ./...

      - name: Сборка
        run: make build

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Проверка install.sh
        run: shellcheck install.sh
