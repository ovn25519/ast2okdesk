# =============================================================================
# ast2okdesk — пример файла конфигурации
# =============================================================================
# Скопируйте этот файл в config.toml рядом с бинарником и заполните значения.
# После установки через install.sh файл config.toml создаётся автоматически с
# правами 0600 и уже не перезаписывается при повторных запусках установщика.
#
# ВАЖНО (отступление от первоначального ТЗ):
#   параметры Asterisk объединены в секцию [asterisk], а подключение к AMI —
#   в плоские ключи ami_* внутри неё (ранее планировались секции [route] и
#   [ami]). Дополнительно добавлен параметр caddy.allowed_ips (allowlist
#   доступа к записям разговоров).
#
# Значения ниже соответствуют значениям по умолчанию, кроме обязательных
# плейсхолдеров, которые нужно заменить на реальные (отмечены <...>).
# =============================================================================

# -----------------------------------------------------------------------------
# Asterisk: очередь, часовой пояс и доступ к AMI
# -----------------------------------------------------------------------------
[asterisk]
# Часовой пояс сервера Asterisk в формате IANA. Обязателен, значения по
# умолчанию нет. Все времена из события Cdr трактуются в этой зоне, и в ней же
# формируется минута в имени файла записи. Для сервера s709584 — Asia/Yekaterinburg.
timezone = "Asia/Yekaterinburg"

# Имя очереди, звонки которой журналируются. Обрабатываются только входящие
# звонки этой очереди.
queue = "support"

# Подключение к Asterisk Manager Interface (только чтение). Плоские ключи ami_*.
ami_host = "localhost"
ami_port = 5038
ami_user = "ast2okdesk"
# Пароль AMI. Храните только в config.toml (права 0600); не коммитьте в git.
ami_password = "<AMI_PASSWORD>"

# -----------------------------------------------------------------------------
# Okdesk: REST API и параметры телефонии
# -----------------------------------------------------------------------------
[okdesk]
# Базовый URL аккаунта без завершающего «/».
base_url = "https://intellektstroy.okdesk.ru"
# API-ключ пользователя с ролью «Администратор». Храните только в config.toml.
api_token = "<OKDESK_API_TOKEN>"

# Общий внутренний номер Okdesk. Если задан — подставляется для ВСЕХ звонков
# вместо номера, пришедшего от Asterisk (удобно, когда оператор один).
# Если не задан — номер берётся из имени peer: peer «327» даст номер 327.
# Точечные переопределения [[employees]] имеют приоритет над этим параметром.
telephony_number = 327

# Входящий номер линии (receiver_phone в записи о звонке).
incoming_phone_number = "<INCOMING_PHONE_NUMBER>"

# Сколько последних цифр номера клиента использовать при поиске в Okdesk (1..10).
search_numbers_count = 10

# Автоматическая привязка записи о звонке к открытой заявке клиента.
# По умолчанию выключена: звонок журналируется без привязки, а привязку к
# заявке выполняет координатор вручную. Установите true, чтобы сервис сам
# подбирал заявку (контакт/компания → открытые заявки → ближайший срок).
auto_link_issue = false

# Часовой пояс аккаунта Okdesk (IANA). Применяется только к started_at и
# finished_at в API okdesk. Для аккаунта intellektstroy — Europe/Moscow.
# При внедрении сверьте зону с профилем аккаунта.
timezone = "Europe/Moscow"

# -----------------------------------------------------------------------------
# Раздача записей разговоров
# -----------------------------------------------------------------------------
[recordings]
# Базовый URL, по которому доступны MP3-файлы. Должен соответствовать домену и
# порту caddy.web_port ниже. Завершающий «/» добавляется автоматически.
# Пример: https://calls.example.ru:8443/records/
base_url = "https://calls.example.ru:8443/records/"

# Каталог с MP3-файлами на сервере. Caddy отдаёт файлы именно из него.
files_dir = "/var/calls"

# -----------------------------------------------------------------------------
# Caddy: HTTPS-раздача файлов записей
# -----------------------------------------------------------------------------
[caddy]
# Порт HTTPS. Порты 80 и 443 использовать нельзя — они заняты другим сервисом.
web_port = 8443

# DNS-провайдер для выпуска сертификата по DNS-01. Для reg.ru — "regru".
dns_provider = "regru"

# Учётные данные DNS-провайдера. Для systemd-юнита okdesk-caddy.service это путь
# к env-файлу с переменными REGRU_USERNAME и REGRU_PASSWORD.
dns_credentials = "/opt/ast2okdesk/caddy.env"

# Allowlist доступа к записям: IP-адреса или CIDR. Требуется хотя бы один.
# Укажите здесь исходящие IP-адреса серверов Okdesk.
allowed_ips = [
  "203.0.113.10",
  "198.51.100.0/24",
]

# -----------------------------------------------------------------------------
# Досылка записей о звонках при сбоях Okdesk API
# -----------------------------------------------------------------------------
[retry]
# Максимальное число попыток отправки; после исчерпания пишется ALERT и запись
# удаляется из очереди.
max_attempts = 8
# Начальная задержка перед повтором, секунды (далее удваивается).
initial_backoff_seconds = 5
# Максимальная задержка между попытками, секунды.
max_backoff_seconds = 3600

# -----------------------------------------------------------------------------
# Хранение и чистка служебной БД SQLite
# -----------------------------------------------------------------------------
[retention]
# Через сколько часов удалять незавершённые корреляции и записи дедупликации.
correlation_ttl_hours = 24
# Как часто запускать уборку, минуты.
cleanup_interval_minutes = 10

# -----------------------------------------------------------------------------
# Операторы: точечные переопределения номеров (исключение, не правило)
# -----------------------------------------------------------------------------
# Внутренний номер оператора для screen-pop определяется по первому сработавшему
# источнику:
#   1. запись [[employees]] с совпавшим sip_peer;
#   2. okdesk.telephony_number — если задан, подставляется всегда;
#   3. имя peer как есть, если оно числовое (telephony_number не задан).
# Если ни один источник не дал номер, screen-pop пропускается с предупреждением
# в логе, но звонок всё равно журналируется.
# При ringall screen-pop выполняется для каждого оператора отдельно.
# Дубликаты sip_peer недопустимы.

# [[employees]]
# sip_peer = "ivan"
# okdesk_telephony_number = 327
